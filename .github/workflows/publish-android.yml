name: Publish Android (Maven Snapshot)

permissions:
  contents: write  # create + push the uikit-kmp-<version> git tag on publish
  packages: write  # publish to this repo's GitHub Packages maven repo

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to publish from'
        required: true
        type: string
        default: 'main'
      core_version:
        description: 'Override co.onestep.android:core version (empty = <catalog>-SNAPSHOT). Must exist on GitHub Packages or Maven Central.'
        required: false
        type: string
        default: ''

jobs:
  publish-snapshot:
    # macOS runner: publishAllPublications includes the iOS klib publications,
    # which can only be compiled on a macOS host.
    runs-on: macos-latest
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      # GH_PACKAGES_TOKEN (PAT with read:packages on OneStepRND) is needed to
      # resolve co.onestep.android:core and co.onestep:design-system from other
      # repos' packages. Falls back to github.token, which can only read/write
      # THIS repo's packages.
      GITHUB_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN != '' && secrets.GH_PACKAGES_TOKEN || github.token }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set Gradle properties
        id: props
        run: |
          PROPS="-PgithubSnapshot=true"
          if [ -n "${{ github.event.inputs.core_version }}" ]; then
            PROPS="$PROPS -PcoreVersion=${{ github.event.inputs.core_version }}"
          fi
          echo "gradle_props=$PROPS" >> "$GITHUB_OUTPUT"

      # Note: no separate "assemble" smoke step — since the Gradle 9 move,
      # `uikit-kmp:assembleRelease` is an ambiguous task-name abbreviation (only the XCFramework
      # fat-framework tasks match), and the publish step below assembles the publications itself.

      - name: Resolve version
        id: gav
        run: |
          set -euo pipefail
          VERSION=$(./gradlew -q uikit-kmp:properties ${{ steps.props.outputs.gradle_props }} | awk '/^version:/{print $2}')
          echo "Resolved version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish snapshot to GitHub Packages
        timeout-minutes: 40
        run: |
          ./gradlew uikit-kmp:publishAllPublicationsToGitHubPackagesRepository \
            ${{ steps.props.outputs.gradle_props }} --no-parallel --max-workers=2

      # Tag the published commit so main stays consistent with published versions.
      # Matches the iOS convention (uikit-kmp-<version>, see publish-xcframework.sh).
      # Uses the checkout-persisted GITHUB_TOKEN (not the PAT) so the tag never
      # re-triggers workflows. Snapshots move a mutable tag; releases never clobber.
      - name: Tag published version on the commit
        run: |
          set -euo pipefail
          VERSION="${{ steps.gav.outputs.version }}"
          TAG="uikit-kmp-${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [[ "$VERSION" == *-SNAPSHOT ]]; then
            echo "Snapshot: moving mutable tag $TAG to $(git rev-parse --short HEAD)"
            git tag -f "$TAG"
            git push -f origin "refs/tags/$TAG"
          else
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
              echo "Release tag $TAG already exists - leaving it untouched."
            else
              git tag "$TAG"
              git push origin "refs/tags/$TAG"
            fi
          fi
          echo "Tagged $TAG at $(git rev-parse HEAD)"

      - name: Publication summary
        run: |
          echo "🎉 Published co.onestep.kmp:uikit-kmp:${{ steps.gav.outputs.version }}"
          echo "Repository: https://maven.pkg.github.com/OneStepRND/onestep-uikit-kmp"
          echo ""
          echo "Consumers add to their repositories block:"
          echo "  maven { url = uri(\"https://maven.pkg.github.com/OneStepRND/onestep-uikit-kmp\") }"
          echo "and depend on:"
          echo "  implementation(\"co.onestep.kmp:uikit-kmp:${{ steps.gav.outputs.version }}\")"
