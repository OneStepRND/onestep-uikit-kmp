name: PR compile gate

# Runs the CLAUDE.md compile gate (Android + iOS) and the Android host unit tests on every PR,
# then builds the OSTUIKitKMP Swift bridge against a freshly built debug XCFramework so Swift
# changes are compiled too. macOS runner: the iOS Kotlin/Native targets only compile on a
# macOS host.

permissions:
  contents: read
  packages: read

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: pr-compile-gate-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  gradle:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      # Same PAT the publish workflows use to resolve co.onestep.android:core and
      # co.onestep:design-system from other repos' GitHub Packages.
      GITHUB_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN != '' && secrets.GH_PACKAGES_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Compile gate (Android + iOS)
        run: ./gradlew :uikit-kmp:compileAndroidMain :uikit-kmp:compileKotlinIosSimulatorArm64 --no-parallel --max-workers=2

      - name: Android host unit tests
        run: ./gradlew :uikit-kmp:testAndroidHostTest --no-parallel --max-workers=2

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-host-test-reports
          path: uikit-kmp/build/reports/tests/
          if-no-files-found: ignore

  swift-bridge:
    runs-on: macos-latest
    timeout-minutes: 75
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN != '' && secrets.GH_PACKAGES_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug XCFramework
        run: ./gradlew :uikit-kmp:assembleOSTUIKitDebugXCFramework --no-parallel --max-workers=2

      - name: Build OSTUIKitKMP Swift package (iOS Simulator)
        working-directory: uikit-kmp/OSTUIKitKMP
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme OSTUIKitKMP \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO
