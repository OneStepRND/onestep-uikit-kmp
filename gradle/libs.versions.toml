[versions]
kotlin = "2.3.0"
androidGradle = "8.11.1"
composeMultiplatform = "1.9.0"
coroutines = "1.10.1"
kotlinxSerializationJson = "1.8.1"
coreVersion = "2.0.3"
designSystem = "1.1.0"
media3 = "1.4.1"
coil = "2.6.0"
activityCompose = "1.10.1"

[libraries]
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }
onestep-design-system = { module = "co.onestep:design-system", version.ref = "designSystem" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

# Coil - Image loading library
coil = { module = "io.coil-kt:coil", version.ref = "coil" }
coil-gif = { module = "io.coil-kt:coil-gif", version.ref = "coil" }
coil-compose = { module = "io.coil-kt:coil-compose", version.ref = "coil" }

# Exoplayer - Video player
media3-expoplyaer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
kotlin-compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
android-library = { id = "com.android.library", version.ref = "androidGradle" }
maven-publish = { id = "maven-publish" }
signing = { id = "signing" }
nmcp = { id = "com.gradleup.nmcp" }
